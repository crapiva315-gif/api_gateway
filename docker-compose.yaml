name: microservices-system

networks:
  backend:
    driver: bridge

volumes:
  auth-db-data:
  user-db-data:
  order-db-data:
  redis-data:
  payment-mongo-data:

services:

  # ---------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
    volumes:
      - user-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    volumes:
      - order-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ../auth_service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USERNAME: auth_user
      DB_PASSWORD: auth_pass
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - backend

  user-service:
    build:
      context: ../user_service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_db
      SPRING_DATASOURCE_USERNAME: user_user
      SPRING_DATASOURCE_PASSWORD: user_pass
      DB_HOST: user-db
      DB_PORT: 5432
      DB_NAME: user_db
      DB_USERNAME: user_user
      DB_PASSWORD: user_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - backend

  order-service:
    build:
      context: ../order_service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/order_db
      SPRING_DATASOURCE_USERNAME: order_user
      SPRING_DATASOURCE_PASSWORD: order_pass
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USERNAME: order_user
      DB_PASSWORD: order_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      order-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8082:8082"
    networks:
      - backend

  mongodb:
    image: mongo:latest
    container_name: payment_mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - payment-mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "try { quit(rs.status().ok ? 0 : 1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}); quit(1) }" ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    networks:
      - backend

  kafka:
    image: apache/kafka:3.9.1
    container_name: payment_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - backend

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:19092
        --create --if-not-exists
        --topic payment-events
        --partitions 3
        --replication-factor 1
    restart: "no"
    networks:
      - backend

  connect:
    image: quay.io/debezium/connect:3.7
    container_name: payment_connect
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: payment-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    networks:
      - backend

  connector-init:
    image: curlimages/curl:8.11.1
    depends_on:
      connect:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ../payment_service/debezium/payment-outbox-connector.json:/connector.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until curl -sf http://connect:8083/connectors > /dev/null;
        do echo 'waiting for Kafka Connect...'; sleep 3; done;
        curl -sS -f -X PUT
        -H 'Content-Type: application/json'
        --data @/connector.json
        http://connect:8083/connectors/payment-outbox-connector/config
    restart: "no"
    networks:
      - backend

  payment-service:
    build:
      context: ../payment_service
      dockerfile: Dockerfile
    image: payment-service:latest
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084
      SPRING_MONGODB_URI: mongodb://mongodb:27017/payments_db?replicaSet=rs0
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8084:8084"
    networks:
      - backend

  api-gateway:
    build:
      context: ./
      dockerfile: Dockerfile
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8080
      ORDER_SERVICE_URL: http://order-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8084
      GATEWAY_SERVICE_LOGIN: ${GATEWAY_SERVICE_LOGIN}
      GATEWAY_SERVICE_PASSWORD: ${GATEWAY_SERVICE_PASSWORD}
    depends_on:
      - auth-service
      - user-service
      - order-service
      - payment-service
    ports:
      - "8090:8090"
    networks:
      - backend